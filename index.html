<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>業務日報</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="日報">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2921/2921222.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; max-width: 100%; overflow-x: hidden; margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      background-color: #f8fafc; color: #1e293b; touch-action: manipulation;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 70px);
    }
    input, textarea, select { font-size: 16px !important; }
    .active-tab { color: #2563eb; font-weight: 700; }
    .active-tab i { stroke-width: 2.5px; }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header class="bg-white/95 backdrop-blur border-b border-slate-200 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm">
        <i data-lucide="pen-line" class="w-4 h-4"></i>
      </div>
      <h1 id="page-title" class="text-base font-bold text-slate-900">日報作成</h1>
    </div>
    <span class="text-[11px] font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200 px-2 py-0.5 rounded-full flex items-center gap-1">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 接続完了
    </span>
  </header>

  <!-- トースト通知 -->
  <div id="toast" class="hidden fixed top-14 inset-x-4 mx-auto max-w-xs bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg z-50 flex items-center gap-2 text-xs font-medium transition-all">
    <i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-msg">日報を保存しました</span>
  </div>

  <!-- メインコンテンツ -->
  <main class="w-full px-3.5 mt-3 space-y-3">

    <!-- 1. 日報作成 -->
    <section id="tab-create-view" class="space-y-3">
      <form id="daily-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-slate-600 flex items-center gap-1">
              <i data-lucide="calendar" class="w-3.5 h-3.5 text-blue-600"></i> 対象日時
            </label>
            <div class="flex gap-1">
              <button type="button" onclick="setQuickDate(0)" class="text-[11px] bg-slate-100 active:bg-blue-100 text-slate-700 font-medium px-2 py-1 rounded-md">今日</button>
              <button type="button" onclick="setQuickDate(-1)" class="text-[11px] bg-slate-100 active:bg-blue-100 text-slate-700 font-medium px-2 py-1 rounded-md">昨日</button>
              <button type="button" onclick="setQuickDate(-2)" class="text-[11px] bg-slate-100 active:bg-blue-100 text-slate-700 font-medium px-2 py-1 rounded-md">一昨日</button>
            </div>
          </div>
          <input type="datetime-local" id="targetDate" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 font-semibold outline-none focus:border-blue-500">
        </div>

        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-1.5">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-slate-600">業務区分</label>
            <button type="button" onclick="addNewCategory()" class="text-xs text-blue-600 font-bold hover:underline">+ 区分追加</button>
          </div>
          <select id="category" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 font-medium outline-none focus:border-blue-500">
            <option value="通常業務">通常業務</option>
            <option value="インシデント/トラブル">インシデント/トラブル</option>
            <option value="プロジェクト/開発">プロジェクト/開発</option>
            <option value="定例/ミーティング">定例/ミーティング</option>
            <option value="改善提案">改善提案</option>
            <option value="メモ/備忘録（月報対象外）">メモ/備忘録（月報対象外）</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-1.5">
          <label class="block text-xs font-bold text-slate-600">業務タイトル / 概要</label>
          <input type="text" id="title" required placeholder="例: サーバー定期メンテ、定例MTG" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 outline-none focus:border-blue-500">
        </div>

        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-1.5">
          <label class="block text-xs font-bold text-slate-600">本文（作業内容・詳細）</label>
          <textarea id="content" rows="5" required placeholder="作業手順や結果を入力..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-900 outline-none focus:border-blue-500 leading-relaxed"></textarea>
        </div>

        <button type="submit" id="save-btn" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold py-3.5 rounded-2xl shadow-md shadow-blue-500/20 text-sm flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
          <i data-lucide="send" class="w-4 h-4"></i> スプレッドシートに保存
        </button>
      </form>
    </section>

    <!-- 2. 履歴（メール一覧風アコーディオン） -->
    <section id="tab-history-view" class="hidden space-y-3">
      <div class="bg-white p-2.5 rounded-xl border border-slate-200 flex items-center gap-2 shadow-sm">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 ml-1"></i>
        <input type="text" id="search-box" oninput="renderHistory()" placeholder="タイトルや本文で検索..." class="w-full bg-transparent outline-none text-xs">
        <button onclick="loadHistory()" class="text-xs bg-slate-100 active:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md flex items-center gap-1">
          <i data-lucide="refresh-cw" class="w-3 h-3"></i> 更新
        </button>
      </div>

      <div id="history-container" class="space-y-2">
      </div>
    </section>

    <!-- 3. 月報サマリー -->
    <section id="tab-monthly-view" class="hidden space-y-3">
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-600">集計年月</span>
          <input type="month" id="monthly-month" onchange="loadMonthlySummary()" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs font-bold">
        </div>
      </div>

      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-700">月間作業内容（箇条書き）</span>
          <button type="button" onclick="copyMonthlyText()" class="text-xs bg-blue-50 text-blue-600 font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
            <i data-lucide="copy" class="w-3 h-3"></i> コピー
          </button>
        </div>
        <textarea id="monthly-text-area" rows="7" readonly class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 font-mono outline-none leading-relaxed"></textarea>
      </div>
    </section>

  </main>

  <!-- ボトムタブバー -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-slate-200 z-40 flex justify-around items-center h-14" style="padding-bottom: env(safe-area-inset-bottom);">
    <button onclick="changeTab('create')" id="nav-create" class="active-tab flex flex-col items-center justify-center flex-1 py-1 text-slate-400">
      <i data-lucide="edit-3" class="w-5 h-5 mb-0.5"></i>
      <span class="text-[10px]">日報作成</span>
    </button>
    <button onclick="changeTab('history')" id="nav-history" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400">
      <i data-lucide="clock" class="w-5 h-5 mb-0.5"></i>
      <span class="text-[10px]">日報履歴</span>
    </button>
    <button onclick="changeTab('monthly')" id="nav-monthly" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400">
      <i data-lucide="file-text" class="w-5 h-5 mb-0.5"></i>
      <span class="text-[10px]">月報サマリー</span>
    </button>
  </nav>

  <script>
    // ★ ご提供いただいた最新のApps Script URLを設定済みです ★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxdBK3_XOEFHIjp8R5ZnU8RAZdI_xccSuWI9j7SC1CckBypZH6W3gf9Ilqk3Y02eW8/exec";

    let historyList = [];

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // CORS制限を完全に回避するJSONP通信関数
    function fetchJsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        
        window[callbackName] = function(data) {
          delete window[callbackName];
          document.body.removeChild(script);
          resolve(data);
        };

        script.onerror = function(err) {
          delete window[callbackName];
          document.body.removeChild(script);
          reject(new Error('通信に失敗しました'));
        };

        const separator = url.includes('?') ? '&' : '?';
        script.src = `${url}${separator}callback=${callbackName}`;
        document.body.appendChild(script);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      setNowDateTime();
      initMonthlyMonth();
      loadCategories();
      loadHistory();
    });

    function setNowDateTime() {
      const now = new Date();
      const iso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      document.getElementById('targetDate').value = iso;
    }

    function setQuickDate(offset) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      const iso = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      document.getElementById('targetDate').value = iso;
    }

    function initMonthlyMonth() {
      const now = new Date();
      document.getElementById('monthly-month').value = now.toISOString().slice(0, 7);
    }

    function changeTab(tab) {
      const views = { create: 'tab-create-view', history: 'tab-history-view', monthly: 'tab-monthly-view' };
      const navs = { create: 'nav-create', history: 'nav-history', monthly: 'nav-monthly' };
      const titles = { create: '日報作成', history: '日報履歴', monthly: '月報サマリー' };

      Object.keys(views).forEach(key => {
        document.getElementById(views[key]).classList.add('hidden');
        document.getElementById(navs[key]).className = 'flex flex-col items-center justify-center flex-1 py-1 text-slate-400';
      });

      document.getElementById(views[tab]).classList.remove('hidden');
      document.getElementById(navs[tab]).className = 'active-tab flex flex-col items-center justify-center flex-1 py-1 text-blue-600';
      document.getElementById('page-title').textContent = titles[tab];

      if (tab === 'history') loadHistory();
      if (tab === 'monthly') loadMonthlySummary();
      lucide.createIcons();
    }

    // 業務区分読み込み
    async function loadCategories() {
      try {
        const data = await fetchJsonp(`${GAS_API_URL}?action=getMaster`);
        if (data && data.categories) {
          const select = document.getElementById('category');
          select.innerHTML = data.categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    // 業務区分追加
    async function addNewCategory() {
      const name = prompt('新しい業務区分名を入力してください:');
      if (name && name.trim()) {
        showToast(`「${name}」を追加中...`);
        try {
          await fetchJsonp(`${GAS_API_URL}?action=addMaster&item=${encodeURIComponent(name.trim())}`);
          showToast(`「${name}」を追加しました`);
          loadCategories();
        } catch (e) {
          alert('追加に失敗しました');
        }
      }
    }

    // 日報保存
    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.innerHTML = `保存中...`;

      const formData = {
        targetDate: document.getElementById('targetDate').value.replace('T', ' '),
        category: document.getElementById('category').value,
        title: document.getElementById('title').value,
        content: document.getElementById('content').value
      };

      try {
        await fetchJsonp(`${GAS_API_URL}?action=save&data=${encodeURIComponent(JSON.stringify(formData))}`);

        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> スプレッドシートに保存`;
        lucide.createIcons();

        showToast('日報を保存しました！');
        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
        setNowDateTime();
        loadHistory();
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> スプレッドシートに保存`;
        alert('保存に失敗しました: ' + err);
      }
    }

    // 履歴読み込み
    async function loadHistory() {
      const container = document.getElementById('history-container');
      container.innerHTML = '<div class="text-center py-6 text-xs text-slate-400">履歴を読み込み中...</div>';

      try {
        const data = await fetchJsonp(`${GAS_API_URL}?action=getReports`);
        historyList = data || [];
        renderHistory();
      } catch (err) {
        container.innerHTML = '<div class="bg-white p-6 rounded-xl border border-red-200 text-center text-xs text-red-500">履歴の取得に失敗しました</div>';
      }
    }

    // 履歴描画（メール一覧風アコーディオン）
    function renderHistory() {
      const container = document.getElementById('history-container');
      const q = (document.getElementById('search-box')?.value || '').toLowerCase();

      const filtered = historyList.filter(item => 
        (item.title && item.title.toLowerCase().includes(q)) ||
        (item.content && item.content.toLowerCase().includes(q)) ||
        (item.category && item.category.toLowerCase().includes(q)) ||
        (item.date && item.date.includes(q))
      );

      if (filtered.length === 0) {
        container.innerHTML = '<div class="bg-white p-6 rounded-xl border border-slate-200 text-center text-xs text-slate-400">登録された日報データがありません</div>';
        return;
      }

      container.innerHTML = filtered.map((item, idx) => {
        const isMemo = item.category.includes('メモ') || item.category.includes('備忘録');
        const badgeColor = isMemo ? 'bg-slate-100 text-slate-600' : 'bg-blue-50 text-blue-600';

        return `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden mb-2">
            <!-- メール一覧風ヘッダー（日付・区分・タイトルのみ） -->
            <div onclick="toggleHistoryDetail(${idx})" class="p-3.5 flex items-start justify-between cursor-pointer active:bg-slate-50 transition-colors">
              <div class="space-y-1 flex-1 pr-3">
                <div class="flex items-center gap-2 text-[11px]">
                  <span class="font-bold px-2 py-0.5 rounded ${badgeColor}">${item.category}</span>
                  <span class="text-slate-400 font-medium">${item.date}</span>
                </div>
                <h3 class="text-sm font-bold text-slate-900 leading-snug">${item.title}</h3>
              </div>
              <div id="chevron-${idx}" class="text-slate-400 mt-1 transition-transform duration-200">
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
              </div>
            </div>

            <!-- タップで展開される本文のみ -->
            <div id="detail-${idx}" class="hidden px-3.5 pb-3.5 pt-2 border-t border-slate-100 bg-slate-50/70">
              <p class="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed">${item.content || '（本文なし）'}</p>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function toggleHistoryDetail(idx) {
      const detail = document.getElementById(`detail-${idx}`);
      const chevron = document.getElementById(`chevron-${idx}`);
      if (!detail) return;

      const isHidden = detail.classList.contains('hidden');
      if (isHidden) {
        detail.classList.remove('hidden');
        if (chevron) chevron.style.transform = 'rotate(180deg)';
      } else {
        detail.classList.add('hidden');
        if (chevron) chevron.style.transform = 'rotate(0deg)';
      }
    }

    async function loadMonthlySummary() {
      const ym = document.getElementById('monthly-month').value;
      try {
        const data = await fetchJsonp(`${GAS_API_URL}?action=getMonthly&ym=${ym}`);
        if (data) {
          document.getElementById('monthly-text-area').value = `【${data.yearMonth}度 業務実施内容】\n${data.tasksText}`;
        }
      } catch (e) {
        console.error(e);
      }
    }

    function copyMonthlyText() {
      const ta = document.getElementById('monthly-text-area');
      ta.select();
      navigator.clipboard.writeText(ta.value);
      showToast('テキストをコピーしました');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }
  </script>
</body>
</html>
